<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>尼貝爾直播紀錄館</title>
<meta name="description" content="VTuber 尼貝爾 Nibel 的直播紀錄：時間軸、書單、議題、歌單與 Shorts 精華，每天自動更新。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
/* VOICE: elegant, a little mysterious — a theatre troupe's programme archive for 哈尼們
   IDEA: 創傷劇團的演出節目冊：每一場直播是一張「演出劇照」，翻開就是那一場的時間軸
   PICTURE: wall of real stream thumbnails; the newest show as a large poster; a month-by-month bar strip
   COLOUR and TYPE: Ink Night ground, Midnight panels, Glint single accent, Gilt ✦ ornaments; Noto Serif TC 900 / Noto Sans TC / Cormorant italic numerals
   LAYOUT: tartan header (title + featured poster) → year strip → sticky search + tabs → thumbnail grids, detail sheet with chapters */
:root{color-scheme:dark;--ink:#1A1B22;--mid:#1E2A4F;--slate:#44597F;--glint:#51A8DD;--pearl:#EEF0F4;--silver:#B9BDC8;--gilt:#C8A55A;--rule:#2A2C36;--panel:#20222B;
--serif:"Noto Serif TC","PMingLiU",serif;--sans:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;--orn:"Cormorant Garamond",Georgia,serif}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--ink);color:var(--pearl);font:16px/1.65 var(--sans);overflow-x:clip}
a{color:inherit}
button{font:inherit;color:inherit}
.band{padding:clamp(24px,4vw,52px) max(4vw,14px)}
.wrap{max-width:1240px;margin:0 auto}
header{position:relative;background-color:var(--mid);background-image:repeating-linear-gradient(45deg,rgba(10,12,20,.6) 0 26px,transparent 26px 52px),repeating-linear-gradient(-45deg,rgba(10,12,20,.6) 0 26px,transparent 26px 52px),repeating-linear-gradient(45deg,transparent 0 12px,rgba(81,168,221,.3) 12px 13px,transparent 13px 26px)}
header::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(26,27,34,.97) 0%,rgba(26,27,34,.85) 55%,rgba(26,27,34,.6) 100%)}
header .wrap{position:relative}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(20px,4vw,48px);align-items:center}
.eyebrow{font:italic 600 20px/1.2 var(--orn);color:var(--gilt);margin:0 0 10px}
h1{font:900 clamp(34px,5.6vw,54px)/1.08 var(--serif);margin:0;text-wrap:balance}
.lede{color:var(--silver);max-width:46ch;margin:14px 0 0}
.stats{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:22px}
.stat b{display:block;font:600 clamp(28px,3.6vw,40px)/1 var(--orn)}
.stat span{font-size:13px;color:var(--silver)}
.stat:first-child b{color:var(--glint)}
.feat{all:unset;cursor:pointer;display:block;position:relative;border-radius:22px;overflow:hidden;border:1px solid rgba(200,165,90,.5);outline:1px solid rgba(200,165,90,.22);outline-offset:8px;box-shadow:0 30px 60px -30px #000}
.feat:focus-visible{outline:2px solid var(--glint)}
.feat .th{aspect-ratio:16/9}
.feat .cap{position:absolute;inset:auto 0 0 0;padding:44px 18px 14px;background:linear-gradient(transparent,rgba(26,27,34,.95))}
.feat .cap small{font:italic 600 15px var(--orn);color:var(--gilt)}
.feat .cap b{display:block;font:700 clamp(16px,2vw,20px)/1.4 var(--serif);text-wrap:balance}
.th{display:block;width:100%;height:auto;background:var(--panel);object-fit:cover;color:transparent}
.strip{margin-top:28px;background:rgba(26,27,34,.75);border:1px solid rgba(200,165,90,.3);border-radius:20px;padding:16px 16px 10px}
.strip h2{font:700 16px/1.3 var(--serif);margin:0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.strip h2 small{font:400 13px var(--sans);color:var(--silver)}
.bar-wrap{overflow-x:auto}.bar-inner{min-width:560px}
.bars{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;align-items:end;height:120px;margin-top:8px}
.bar{all:unset;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative}
.bar:focus-visible{outline:2px solid var(--glint);outline-offset:2px}
.bar i{display:block;background:var(--slate);border-radius:5px 5px 0 0;transition:height .5s}
.bar i.on{background:var(--glint);border-radius:0}.bar i.on:last-child{border-radius:5px 5px 0 0}
.bar em{position:absolute;top:-2px;left:0;right:0;text-align:center;font:italic 600 13px var(--orn);color:var(--silver)}
.months{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;margin-top:4px;font:italic 500 13px var(--orn);color:var(--silver);text-align:center}
.controls{position:sticky;top:0;z-index:5;background:rgba(26,27,34,.97);border-bottom:1px solid var(--rule);padding:10px max(4vw,14px)}
.controls .wrap{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.search{flex:1 1 280px;position:relative}
.search input{width:100%;font:16px var(--sans);color:var(--pearl);background:var(--panel);border:1px solid var(--rule);border-radius:999px;padding:10px 44px 10px 18px;min-height:44px}
.search input:focus{outline:2px solid var(--glint);border-color:transparent}
.search button{position:absolute;right:6px;top:50%;translate:0 -50%;width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--silver);font-size:20px;cursor:pointer}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tab,.chip{font:500 15px var(--sans);color:var(--silver);background:transparent;border:1px solid var(--slate);border-radius:999px;padding:7px 15px;min-height:40px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.tab[aria-current=true]{background:var(--glint);color:var(--ink);border-color:var(--glint);font-weight:700}
.tab:focus-visible,.chip:focus-visible,a:focus-visible,.card:focus-visible{outline:2px solid var(--glint);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.chip{font-size:14px;padding:5px 12px;min-height:36px}
.chip[aria-pressed=true]{background:var(--mid);color:var(--pearl);border-color:var(--gilt)}
.chip small{font:italic 600 14px var(--orn);color:var(--gilt)}
main{min-height:60vh}
.count{color:var(--silver);font-size:14px;margin:0 0 14px}
h3.sect{font:900 24px/1.3 var(--serif);margin:8px 0 4px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
h3.sect::before{content:"✦";color:var(--gilt);font-size:18px}
h3.sect span{font:italic 600 17px var(--orn);color:var(--gilt)}
p.sub{color:var(--silver);margin:0 0 14px;font-size:14px}
.month{margin:0 0 30px}
.month h4{font:700 19px/1.3 var(--serif);margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--rule);display:flex;gap:10px;align-items:baseline}
.month h4 span{font:italic 600 16px var(--orn);color:var(--gilt)}
.cardw{display:flex;flex-direction:column;gap:6px;min-width:0}
.setl{border:1px solid var(--rule);border-radius:12px;background:rgba(255,255,255,.02)}
.setl summary{cursor:pointer;list-style:none;padding:7px 12px;font-size:13px;color:var(--glint);font-weight:500}
.setl summary::-webkit-details-marker{display:none}.setl summary::after{content:" ▾";color:var(--silver)}.setl[open] summary::after{content:" ▴"}
.setl ol{list-style:none;margin:0;padding:0 8px 8px;max-height:320px;overflow:auto}.epsetl{margin:-4px 0 14px}.epsetl ol{max-height:440px}
.sl{display:grid;grid-template-columns:4.2em minmax(0,1fr);gap:8px;padding:5px 4px;border-top:1px solid var(--rule);text-decoration:none;color:var(--pearl);font-size:13.5px;line-height:1.45;cursor:pointer;border-radius:6px}
.sl:hover{background:rgba(81,168,221,.1)}.sl time{color:var(--gilt);font:italic 600 13px var(--orn)}.sl small{display:block;color:var(--silver);font-size:12px}
.setall{all:unset;cursor:pointer;margin-left:12px;padding:5px 14px;border-radius:999px;border:1px solid var(--glint);color:var(--glint);font-size:13px;font-weight:500}
.setall[aria-pressed="true"]{background:var(--glint);color:var(--ink,#1A1B22)}
.setall:focus-visible,.setl summary:focus-visible{outline:2px solid var(--glint);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px 16px}
.card{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:8px;border-radius:14px}
.card .pic{position:relative;border-radius:12px;overflow:hidden;background:var(--panel)}
.card .th{aspect-ratio:16/9;transition:transform .35s}
.card:hover .th{transform:scale(1.04)}
.badge{position:absolute;font-size:12px;line-height:1;padding:5px 8px;border-radius:999px;background:rgba(26,27,34,.88);color:var(--pearl);white-space:nowrap}
.badge.dur{right:8px;bottom:8px;font:italic 600 14px var(--orn);padding:4px 8px}
.badge.cat{left:8px;top:8px}
.badge.mem{left:8px;top:8px;background:var(--gilt);color:var(--ink);font-weight:700}
.badge.hit{right:8px;top:8px;background:var(--glint);color:var(--ink);font-weight:700}
.card .t{font-weight:500;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .d{font-size:13px;color:var(--silver);display:flex;gap:8px;flex-wrap:wrap}
mark{background:rgba(81,168,221,.3);color:var(--pearl);border-radius:3px;padding:0 1px}
.hits{display:grid;gap:8px;margin:0 0 30px}
.hitrow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center;text-decoration:none;background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:8px}
.hitrow:hover{border-color:var(--slate)}
.hitrow .th{aspect-ratio:16/9;border-radius:8px}
.hitrow time{font:italic 600 18px var(--orn);color:var(--glint);margin-right:8px;white-space:nowrap}
.hitrow small{display:block;color:var(--silver);font-size:13px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.book{all:unset;cursor:pointer;display:grid;grid-template-rows:auto 1fr;background:var(--panel);border:1px solid var(--rule);border-radius:18px;overflow:hidden}
.book:hover{border-color:rgba(200,165,90,.6)}
.book .th{aspect-ratio:16/9}
.book .in{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.book .n{font:italic 600 15px var(--orn);color:var(--gilt)}
.book h4{font:900 19px/1.35 var(--serif);margin:0;text-wrap:balance}
.book .au{color:var(--silver);font-size:14px}
.shorts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px 12px}
.short{display:flex;flex-direction:column;gap:6px;text-decoration:none}
.short .pic{position:relative;border-radius:14px;overflow:hidden}
.short .th{aspect-ratio:9/16;transition:transform .35s}
.short:hover .th{transform:scale(1.04)}
.short .t{font-size:14px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.short .d{font:italic 600 14px var(--orn);color:var(--silver)}
.sets{column-width:340px;column-gap:16px}
.set{break-inside:avoid;background:var(--panel);border:1px solid var(--rule);border-radius:18px;overflow:hidden;margin:0 0 16px}
.set .head{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center;padding:10px;text-decoration:none;border-bottom:1px solid var(--rule)}
.set .head .th{aspect-ratio:16/9;border-radius:8px}
.set .head small{display:block;font:italic 600 14px var(--orn);color:var(--gilt)}
.set .head b{font:700 15px/1.4 var(--serif)}
.set ol{list-style:none;margin:0;padding:4px 14px 10px}
.song{display:grid;grid-template-columns:4.4em minmax(0,1fr);gap:10px;padding:6px 0;border-top:1px solid var(--rule);text-decoration:none}
.set li:first-child .song{border-top:0}
.song:hover .sn{color:var(--glint)}
.song time{font:italic 600 15px var(--orn);color:var(--glint);text-align:right;white-space:nowrap}
.sn{font-weight:500}.sa{color:var(--silver);font-size:14px;margin-left:8px}
.empty{padding:40px 0;color:var(--silver);text-align:center}
/* detail sheet */
.sheet{position:fixed;inset:0;z-index:20;display:none;background:rgba(10,11,16,.72);backdrop-filter:blur(4px);overflow-y:auto;padding:clamp(0px,3vw,40px) 0}
.sheet.open{display:block}
.panel{max-width:860px;margin:0 auto;background:var(--ink);border:1px solid rgba(200,165,90,.4);border-radius:22px;overflow:clip;position:relative}
@media(max-width:600px){.panel{border-radius:0;border:0;min-height:100%}}
.panel .th{aspect-ratio:16/9}
.player{position:relative;background:#000}
.player.on{position:sticky;top:0;z-index:3;aspect-ratio:16/9}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.poster{all:unset;cursor:pointer;display:block;position:relative;width:100%}
.poster:focus-visible{outline:2px solid var(--glint);outline-offset:-4px}
.pbtn{position:absolute;left:50%;top:50%;translate:-50% -50%;width:76px;height:76px;border-radius:50%;background:rgba(26,27,34,.78);border:1px solid rgba(200,165,90,.7);color:var(--pearl);font-size:28px;display:grid;place-items:center;padding-left:5px;transition:transform .2s}
.poster:hover .pbtn{transform:scale(1.08)}
.perr{margin:0;padding:22px;color:var(--silver);background:var(--panel)}
.perr a{color:var(--glint)}
.month{scroll-margin-top:84px}
.csep{width:1px;height:26px;background:var(--rule);margin:0 4px;align-self:center}
/* 書櫃 */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:46px 26px;padding:6px 6px 0;perspective:1200px}
.bk{all:unset;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:8px;padding-bottom:14px}
.bk::after{content:"";position:absolute;left:-14px;right:-14px;bottom:-12px;height:14px;background:linear-gradient(#3a2f26,#241c16);border-top:2px solid #5a4636;box-shadow:0 14px 20px -8px #000;z-index:-1}
.bcov{position:relative;display:block;aspect-ratio:2/3;border-radius:3px 6px 6px 3px;overflow:hidden;box-shadow:6px 8px 18px -6px rgba(0,0,0,.85),inset 0 0 0 1px rgba(255,255,255,.06);transform-origin:left center;transition:transform .35s,box-shadow .35s;background:var(--panel)}
.bcov::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.45) 0,rgba(255,255,255,.18) 3%,rgba(0,0,0,.12) 6%,transparent 12%)}
.bk:hover .bcov,.bk:focus-visible .bcov{transform:translateY(-10px) rotateY(-16deg);box-shadow:16px 18px 30px -8px rgba(0,0,0,.9),0 0 30px rgba(81,168,221,.25)}
.bk:focus-visible{outline:2px solid var(--glint);outline-offset:6px;border-radius:6px}
.bimg{display:block;width:100%;height:100%;object-fit:cover}
.tcover{padding:0}.tcover>.th,.tsleeve>.th{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tcover::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 0 38%,color-mix(in srgb,var(--bg) 75%,transparent) 52%,transparent 72%);pointer-events:none}
.gband{position:relative;z-index:1;display:flex;flex-direction:column;gap:5px;padding:0 11% 13%;margin-top:auto}
.tcover .gstar{z-index:1;color:#fff;text-shadow:0 1px 6px #000}
.tsleeve>.th{z-index:0}.rcover{padding:0;background:#111}.rcover>.th{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.tsleeve::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(to top,var(--bg) 0 30%,color-mix(in srgb,var(--bg) 85%,transparent) 46%,transparent 72%),linear-gradient(135deg,color-mix(in srgb,var(--ac) 30%,transparent),transparent 50%)}
.tsleeve .stitle,.tsleeve .sart{position:relative;z-index:2}.tsleeve .smark{z-index:2}.tsleeve .smark{color:#fff;text-shadow:0 1px 6px #000}.tsleeve .stitle,.tsleeve .sart,.tcover .gtitle,.tcover .gauth{text-shadow:0 1px 8px color-mix(in srgb,var(--bg) 90%,#000)}
.gcover{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:12% 12% 14%;gap:6px}
.gtitle{font:900 clamp(15px,1.6vw,19px)/1.3 var(--serif);text-wrap:balance;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.gauth{font-size:11.5px;opacity:.85}
.gstar{position:absolute;top:9%;left:12%;font-size:13px;opacity:.8}
.bt{font:700 14px/1.4 var(--serif);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bm{font:italic 600 13px var(--orn);color:var(--gilt);margin-top:-4px}
/* 唱片架 */
.crate{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:30px 30px;padding:4px 40px 0 0}
.rec{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;position:relative}
.rwrap{position:relative;display:block;aspect-ratio:1}
.sleeve{position:absolute;inset:0;z-index:2;border-radius:4px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:11%;box-shadow:0 14px 26px -12px rgba(0,0,0,.9),inset 0 0 0 1px rgba(255,255,255,.08);transition:transform .35s}
.sleeve::after{content:"";position:absolute;inset:0;background:linear-gradient(125deg,rgba(255,255,255,.14),transparent 40%);pointer-events:none}
.smark{position:absolute;top:9%;left:11%;font:italic 600 12px var(--orn);opacity:.8}
.stitle{font:900 clamp(15px,1.5vw,19px)/1.25 var(--serif);text-wrap:balance;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;position:relative}
.sart{font-size:12px;opacity:.85;margin-top:4px;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vinyl{position:absolute;inset:3%;z-index:1;border-radius:50%;background:repeating-radial-gradient(circle,#111 0 2px,#1c1c1c 2px 4px);box-shadow:0 6px 16px -6px #000;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.vinyl i{position:absolute;inset:33%;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(0,0,0,.25)}
.vinyl i::after{content:"";position:absolute;inset:44%;border-radius:50%;background:#111}
.rec:hover .vinyl,.rec:focus-visible .vinyl{transform:translateX(34%) rotate(200deg)}
.rec:hover .sleeve,.rec:focus-visible .sleeve{transform:translateX(-4%)}
.rec:focus-visible{outline:2px solid var(--glint);outline-offset:6px;border-radius:6px}
.rcount{position:absolute;z-index:3;top:-9px;right:-9px;background:var(--glint);color:var(--ink);font:italic 600 16px var(--orn);border-radius:999px;padding:2px 9px;box-shadow:0 4px 10px -4px #000}
.rt{font:700 15px/1.35 var(--serif);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ra{font-size:13px;color:var(--silver);margin-top:-3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 書與唱片的詳細頁 */
.mhead{display:grid;grid-template-columns:170px minmax(0,1fr);gap:24px;align-items:end;padding:28px clamp(16px,3vw,28px) 18px;background:linear-gradient(180deg,rgba(81,168,221,.12),transparent)}
.mcov{position:relative;display:block;aspect-ratio:2/3;border-radius:4px;overflow:hidden;box-shadow:10px 14px 30px -10px #000}
.mcov.sq{aspect-ratio:1}.mcov .sleeve{position:absolute}
.mcov.sq{position:relative;overflow:visible}.mcov.sq>.sleeve{z-index:1}.mvinyl{position:absolute;inset:4%;z-index:0;border-radius:50%;border:1px solid rgba(200,165,90,.45);background:radial-gradient(circle,var(--gilt,#C8A55A) 0 9%,#111 9.5% 11%,transparent 11.5%),repeating-radial-gradient(circle,#101014 0 2px,#1d1e24 2px 4px);box-shadow:0 10px 24px -10px #000}.mvinyl::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,transparent 0 10%,rgba(255,255,255,.12) 14%,transparent 20% 60%,rgba(255,255,255,.08) 64%,transparent 70%)}
.mhead h2{font:900 clamp(22px,3vw,30px)/1.3 var(--serif);margin:4px 0 6px;text-wrap:balance}
.eb2{font:italic 600 16px var(--orn);color:var(--gilt)}
.player:empty{display:none}
.ep{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border-top:1px solid var(--rule);padding:10px 0}
.eprow{display:grid;grid-template-columns:132px minmax(0,1fr);gap:14px;align-items:center;text-decoration:none;border-radius:10px;padding:4px}
.eprow:hover{background:var(--panel)}
.eprow.now{background:rgba(81,168,221,.14);box-shadow:inset 3px 0 0 var(--glint)}
.eprow .th{aspect-ratio:16/9;border-radius:8px}

<script>
{
const CATS=[
 ["member","會員限定",/會員限定|股東大會/],
 ["news","新聞久一點",/新聞久一點/],
 ["book","尼看什麼・說書",/尼看什麼/],
 ["song","歌回・歌雜",/歌回|歌雜/],
 ["issue","議題與尼",/議題與尼|商Talk腦筋/],
 ["debate","辯論",/來辯|來三辯/],
 ["drama","戲劇雜談・朗讀",/戲劇雜談|尼在劇場|台詞回|朗讀|尼好香|主題回/],
 ["podcast","Podcast",/要不要聽聽尼在說什麼|演後座談/],
 ["game","遊戲",/#遊戲|繪畫接力/],
 ["hunter","獵人是尼・旅遊",/獵人是尼|雲端旅遊|租房挑戰|聊日本/],
 ["special","紀念・生日",/誕生日|尼誕祭|Say尼快樂|周年|一個月紀念|初配信|收益化|萬訂|1111|元宵/],
 ["talk","雜談",/./]
];
CATS.splice(CATS.length-1,0,["work","翻唱・作品",/$^/]);
const CN=Object.fromEntries(CATS.map(c=>[c[0],c[1]]));
const isLive=t=>/^\s*【[^】]*#/.test(t)||/繪畫接力大賽/.test(t);
const isPod=t=>/要不要聽聽尼在說什麼|^S\d+EP\d+|^EP\d+/.test(t);
const SC={clip:"直播精華",song:"翻唱・歌曲",topic:"議題短講"};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clean=t=>t.replace(/^【[^】]*】\s*/,"").replace(/^【[^】]*】\s*/,"").replace(/\s*🎭.*$/u,"").replace(/【CC字幕】/g,"").replace(/[\u200b\u202a-\u202e]/g,"").replace(/\s*@\S+/g,"").replace(/\s*#(連動|初見歡迎|初見歓迎|降落歡迎|歡迎降落|新人vtuber|vtuber|新書推薦|2026尼誕祭勒)(?=\s|$)/gi,"").trim();
const secs=t=>String(t).split(":").reduce((a,b)=>a*60+(+b),0);
const yt=(id,t)=>"https://youtu.be/"+encodeURIComponent(id)+(t?"?t="+secs(t):"");
const tlink=(id,t)=>`href="${yt(id,t)}" target="_blank" rel="noopener" data-play="${esc(id)}|${secs(t)}"`;
const norm=s=>String(s??"").toLowerCase().replace(/[\s・·．.、，,！!？?「」『』《》〈〉（）()【】#＃：:／/\-]/g,"");
const WD="日一二三四五六";
const NOISE=/^(OP|ED|開場|晚安|今日曲目回顧|待機|開台待機)/;
let D,S=[],byId={},SH=[],BOOKS=[],RECS=[],state={sec:"home",sub:"",v:"all",cat:"",scat:"",q:"",btype:"",rsort:"count",rlang:""};

function hl(text,q){const t=esc(text);if(!q)return t;const k=esc(q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");try{return t.replace(new RegExp(k,"gi"),m=>"<mark>"+m+"</mark>")}catch(e){return t}}
const SIZES={v:["maxresdefault","hq720","sddefault","hqdefault"],s:["oardefault","oar2","hqdefault"]};
window.nbFallback=img=>{const k=img.dataset.k,n=+img.dataset.n+1,list=SIZES[k];if(n>=list.length){img.onerror=null;return}img.dataset.n=n;img.src="https://i.ytimg.com/vi/"+img.dataset.vid+"/"+list[n]+".jpg"};
const imgOk=img=>{if(img.naturalWidth===120&&img.naturalHeight===90)nbFallback(img)};
window.nbLoad=imgOk;
function th(kind,id,eager){const sz=SIZES[kind][kind==="v"&&!eager?1:0];return `<img class="th" src="https://i.ytimg.com/vi/${encodeURIComponent(id)}/${sz}.jpg" data-k="${kind}" data-vid="${esc(id)}" data-n="${kind==="v"&&!eager?1:0}" alt="" ${eager?"":'loading="lazy"'} decoding="async" onerror="nbFallback(this)" onload="nbLoad(this)">`}

// 歌回時間軸：只收「歌手 - 《歌名》」或「歌名《出處》」，幕、場、OP/ED 這類段落不算歌
function chapSong(c){const x=c.x.replace(/^\s*(\d{1,2}:)?\d{1,2}:\d{2}\s*/,"").trim();if(!x||NOISE.test(x)||/第.幕|第.場|中場|散場|打招呼/.test(x))return null;
  let m=x.match(/^(.+?)\s+-\s+《([^》]+)》\s*$/);if(m)return {t:c.t,s:m[2],a:m[1]};
  m=x.match(/^([^《]+?)\s*《([^》]+)》/);if(m)return {t:c.t,s:m[1].trim(),a:"《"+m[2]+"》"+(x.match(/》《([^》]+)》/)?"《"+x.match(/》《([^》]+)》/)[1]+"》":"")};
  return {t:c.t,s:x,a:""}}
function prep(){
  S=D.streams.map(([date,id,dur,raw],i)=>{
    const live=isLive(raw)&&(!dur||secs(dur)>=1200);  // 20 分鐘以下的是剪輯或預告，不算直播
    const cats=live?CATS.filter(c=>c[0]!=="talk"&&c[2].test(raw)).map(c=>c[0]):[isPod(raw)?"podcast":"work"];
    if(!cats.length)cats.push("talk");
    const r={i,date,id,dur,raw,live,title:live?clean(raw):raw.replace(/\s*【CC字幕】/,"").replace(/\s*#\S+/g,"").replace(/\s*@尼貝爾Nibel\S*/g,"").trim(),cats,collab:/連動|聯動|with|ft\.|feat\./i.test(raw),ym:date.slice(0,7)};
    const b=D.books.find(x=>x[0]===id);if(b){r.book=b[1];r.author=b[2]}
    if(D.news[id])r.topic=D.news[id];
    r.chapters=(D.chapters[id]||[]).map(([t,x])=>({t,x,n:norm(x)}));
    let songs=D.setlists[id]?D.setlists[id].map(s=>({t:s[0],s:s[1],a:s[2]})):null;
    if(!songs){
      const note=r.chapters.filter(c=>/^[🎵🎶♪♫]/u.test(c.x));
      if(note.length)songs=note.map(c=>{const x=c.x.replace(/^[🎵🎶♪♫]\s*/u,"");const m=x.match(/^《([^》]+)》\s*(.*)$/);return m?{t:c.t,s:m[1],a:m[2]}:{t:c.t,s:x,a:""}});
      const sl=songs?[]:r.chapters.filter(c=>/^歌回[①-⑳]/.test(c.x));
      if(songs){}
      else if(sl.length)songs=sl.map(c=>{const m=c.x.replace(/^歌回[①-⑳]：?/,"").split(/\s+-\s+/);return m.length>1?{t:c.t,s:m.slice(1).join(" - "),a:m[0]}:{t:c.t,s:m[0],a:""}});
      else if(cats.includes("song")&&r.chapters.length)songs=r.chapters.map(c=>chapSong(c)).filter(Boolean);
    }
    r.songs=songs&&songs.length?songs:null;

function viewBooks(){

function viewTopics(){

  const groups=[
   ["新聞久一點・本週專題","每週一 20:00，一週國內外新聞，中段放一個深入專題",S.filter(r=>r.topic&&f(r)),r=>r.topic],
   ["議題與尼","找來賓、翻資料，把一個社會議題講清楚",S.filter(r=>r.cats.includes("issue")&&f(r)),r=>r.title],

function viewSongs(){
  const q=qn();

function render(){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-current",String(state.sec==="live"&&t.dataset.v===state.v)));
  document.querySelectorAll(".gsec").forEach(a=>a.setAttribute("aria-current",String(a.dataset.sec===state.sec)));
  let html;
  if(state.sec==="home")html=viewHome();
  else if(state.sec==="news")html=viewNews();
  else if(state.sec==="books")html=state.sub?viewBookCat(state.sub):viewCabinets();
  else if(state.sec==="songs")html=viewJukebox();
  else html=({all:viewAll,shorts:viewShorts,topics:viewTopics}[state.v]||viewAll)();
  document.getElementById("view").innerHTML=html;
  if(state.sec==="live")renderBars();
  buildRail();if(state.sec==="songs")initFlows();animView();
  document.documentElement.style.setProperty("--ctrl",(document.querySelector(".controls").offsetHeight||0)+"px");
}

/* 右側年月滑桿 */
const rail=document.getElementById("rail"),rtrack=document.getElementById("rtrack"),rtip=document.getElementById("rtip");
let railMonths=[],curM="",dragging=false;
const ctrlH=()=>document.querySelector(".controls").offsetHeight;
function buildRail(){
  railMonths=[...document.querySelectorAll(".month[id^='m-']")].map(x=>x.id.slice(2));
  document.body.classList.toggle("has-rail",railMonths.length>1);
  let lastY="";
  rtrack.innerHTML=railMonths.map(k=>{const y=k.slice(0,4),first=y!==lastY;lastY=y;return `<span class="rm${first?" y":""}" data-m="${k}">${first?`<b>${y}</b>`:""}<i></i></span>`}).join("");
  curM="";updateRail();
}
function updateRail(){
  if(railMonths.length<2){rail.classList.remove("show");return}
  const line=ctrlH()+60;let cur=railMonths[0];
  for(const k of railMonths){const el=document.getElementById("m-"+k);if(el&&el.getBoundingClientRect().top<=line)cur=k;else break}
  const first=document.getElementById("m-"+railMonths[0]);
  rail.classList.toggle("show",!!first&&first.getBoundingClientRect().top<innerHeight*.75);
  if(cur!==curM){curM=cur;rtrack.querySelectorAll(".rm").forEach(x=>x.classList.toggle("on",x.dataset.m===cur));
    rtip.innerHTML=`<small>${cur.slice(0,4)}</small>${+cur.slice(5)} 月`;
    rtrack.setAttribute("aria-valuetext",`${cur.slice(0,4)} 年 ${+cur.slice(5)} 月`)}
  const on=rtrack.querySelector(".rm.on");if(on)rtip.style.top=(on.offsetTop+on.offsetHeight/2)+"px";
}
function goMonth(k){const el=document.getElementById("m-"+k);if(el)scrollTo({top:el.getBoundingClientRect().top+scrollY-ctrlH()-8,behavior:"auto"})}
function railAt(y){const b=rtrack.getBoundingClientRect();const i=Math.max(0,Math.min(railMonths.length-1,Math.floor((y-b.top)/b.height*railMonths.length)));goMonth(railMonths[i])}
rtrack.addEventListener("pointerdown",e=>{dragging=true;rtrack.setPointerCapture(e.pointerId);rail.classList.add("drag");railAt(e.clientY)});
rtrack.addEventListener("pointermove",e=>{if(dragging)railAt(e.clientY)});
const endDrag=()=>{dragging=false;rail.classList.remove("drag")};
rtrack.addEventListener("pointerup",endDrag);rtrack.addEventListener("pointercancel",endDrag);
rtrack.addEventListener("keydown",e=>{const i=railMonths.indexOf(curM);if(e.key==="ArrowDown"||e.key==="ArrowRight"){e.preventDefault();goMonth(railMonths[Math.min(railMonths.length-1,i+1)])}if(e.key==="ArrowUp"||e.key==="ArrowLeft"){e.preventDefault();goMonth(railMonths[Math.max(0,i-1)])}});
let railRaf=0,railIdle=0;addEventListener("scroll",()=>{if(!railRaf)railRaf=requestAnimationFrame(()=>{railRaf=0;updateRail()});rail.classList.add("active");clearTimeout(railIdle);railIdle=setTimeout(()=>rail.classList.remove("active"),1200)},{passive:true});
addEventListener("resize",updateRail);

const sheet=document.getElementById("sheet"),panel=document.getElementById("panel");let lastFocus=null;
function chapList(r,f){const q=norm(f);const list=r.chapters.filter(c=>!q||c.n.includes(q));return list.length?list.map(c=>`<a class="chap" ${tlink(r.id,c.t)}><time>${esc(c.t)}</time><span>${hl(c.x,f)}</span></a>`).join(""):`<p class="note">沒有符合的段落</p>`}
/* 站內播放器：用 YouTube 官方嵌入播放器，直接跳到指定秒數 */
let ytReady=null,player=null,playerId=null;
function loadYT(){if(ytReady)return ytReady;ytReady=new Promise(res=>{window.onYouTubeIframeAPIReady=()=>res(window.YT);const sc=document.createElement("script");sc.src="https://www.youtube.com/iframe_api";document.head.appendChild(sc)});return ytReady}
window.__nbPlayer=()=>player;
function stopPlayer(){if(player){try{player.destroy()}catch(e){}}player=null;playerId=null}
async function play(id,t){
  if(!sheet.classList.contains("open")||(panel.dataset.kind!=="multi"&&panel.dataset.id!==id))openSheet(id);
  panel.querySelectorAll(".eprow.now").forEach(e=>e.classList.remove("now"));
  panel.querySelectorAll(`.eprow[data-play="${CSS.escape(id+"|"+Math.floor(t))}"]`).forEach(e=>e.classList.add("now"));
  const box=document.getElementById("player");if(!box)return;
  box.classList.add("on");
  if(player&&playerId===id&&player.seekTo){player.seekTo(t,true);player.playVideo();return}
  stopPlayer();playerId=id;
  box.innerHTML='<div id="ytp"></div>';
  const YT=await loadYT();if(playerId!==id)return;
  player=new YT.Player("ytp",{videoId:id,playerVars:{start:Math.floor(t),autoplay:1,playsinline:1,rel:0},
    events:{onReady:e=>{e.target.seekTo(t,true);e.target.playVideo()},
            onError:()=>{box.classList.remove("on");box.innerHTML=`<p class="perr">這部影片沒辦法在這裡播放（可能是會員限定）。<a href="${yt(id,t?String(t):"")}" target="_blank" rel="noopener">到 YouTube 從這裡開始看 ↗</a></p>`;stopPlayer()}}});
}
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-play]");if(!a||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||e.button>0)return;
  e.preventDefault();e.stopPropagation();const [id,t]=a.dataset.play.split("|");play(id,+t)},true);

function openSheet(id){
  const r=byId[id];if(!r)return;if(!sheet.classList.contains("open"))lastFocus=document.activeElement;stopPlayer();
  const pills=r.cats.map(c=>`<span class="pill">${esc(CN[c])}</span>`).join("")+(r.collab?`<span class="pill">連動・來賓</span>`:"");

  panel.innerHTML=`<button class="close" id="close" aria-label="關閉">×</button><div class="player" id="player"><button class="poster" type="button" data-play="${esc(r.id)}|0" aria-label="在這裡播放">${th("v",r.id,true)}<span class="pbtn">▶</span></button></div><div class="pbody"><div class="pmeta"><span>${esc(r.date.replaceAll("-","."))}</span><span>${esc(r.dur)}</span>${pills}</div><h2 id="ptitle">${esc(r.title)}</h2>${r.book?`<p class="note">書目：《${esc(r.book)}》${r.author?"／"+esc(r.author):""}</p>`:""}${r.topic?`<p class="note">本週專題：${esc(r.topic)}</p>`:""}<a class="watch" href="${yt(r.id)}" target="_blank" rel="noopener">到 YouTube 看這場 ↗</a><p class="note">點時間軸的任何一段，上面的播放器就會從那一秒開始播</p>${r.cats.includes("member")?`<p class="note">這場是會員限定，需要加入頻道會員才能觀看</p>`:""}
  ${(()=>{const rel=SH.filter(x=>(D.shortSource||{})[x.id]===r.id);return rel.length?`<h3>從這場剪出來的 Shorts（${rel.length}）</h3><div class="shorts">${rel.map(x=>`<a class="short" href="https://www.youtube.com/shorts/${encodeURIComponent(x.id)}" target="_blank" rel="noopener"><span class="pic">${th("s",x.id)}</span><span class="t">${esc(x.title)}</span></a>`).join("")}</div>`:""})()}
  ${r.songs?`<h3>歌單（${r.songs.length} 首）</h3>${r.songs.map(s=>`<a class="chap" ${tlink(r.id,s.t)}><time>${esc(s.t)}</time><span>${esc(s.s)}${s.a?`<span class="sa">${esc(s.a)}</span>`:""}</span></a>`).join("")}`:""}
  ${r.chapters.length?`<h3>時間軸（${r.chapters.length} 段）<input id="cf" type="text" placeholder="在這場裡搜尋" value="${esc(f&&chapHits(r).length?f:"")}" aria-label="在這場的時間軸裡搜尋"></h3><div id="cl">${chapList(r,f&&chapHits(r).length?f:"")}</div>`:`<h3>時間軸</h3><p class="note">這場的說明欄還沒有時間軸</p>`}</div>`;
  sheet.classList.add("open");document.body.style.overflow="hidden";sheet.scrollTop=0;
  document.getElementById("close").focus();
  const cf=document.getElementById("cf");if(cf)cf.addEventListener("input",()=>{document.getElementById("cl").innerHTML=chapList(r,cf.value.trim())});
}

function route(){const h=decodeURIComponent(location.hash.slice(1));let [sec,sub]=h.split("/");sec={shelf:"books",records:"songs",all:"live",book:"books"}[sec]||sec;
  const prev=state.sec+"/"+(state.sub||"")+"/"+state.v;
  if(sec==="shorts"||sec==="topics"){state.sec="live";state.v=sec}
  else if(sec==="live"){state.sec="live";state.v="all"}
  else if(["news","books","songs"].includes(sec)){state.sec=sec;state.sub=sub||""}
  else state.sec="home";
  if(prev.split("/")[0]!==state.sec&&!window.__keepQ){state.q="";qi.value="";clr.hidden=true}window.__keepQ=false;
  document.body.dataset.sec=state.sec;document.title=(({live:"直播",news:"新聞報紙攤",books:"說書書櫃",songs:"歌曲點唱機"})[state.sec]?({live:"直播",news:"新聞報紙攤",books:"說書書櫃",songs:"歌曲點唱機"})[state.sec]+"｜":"")+"尼貝爾直播紀錄館";
  render();if(prev!==state.sec+"/"+(state.sub||"")+"/"+state.v)scrollTo(0,0)}
document.getElementById("view").addEventListener("click",e=>{

function newsInfo(r){
  const t=(r.raw||r.title).replace(/^(【[^】]*】\s*)+/,"").replace(/當尼專屬.*$|國內國際大小事.*$/,"").trim();
  const dm=t.match(/(\d{2})\.?(\d{2})\s*[-–~]\s*(\d{2})\.?(\d{2})/);
  let head=t.replace(/(\d{2})\.?(\d{2})\s*[-–~]\s*(\d{2})\.?(\d{2})/,"").replace(/[！!\s]+$/,"").trim();
  let tags=[];
  if(head.includes("/")){const p=head.split("/").map(x=>x.trim()).filter(Boolean);const i=Math.max(0,p.findIndex(x=>/專題/.test(x)));head=p[i];tags=p.filter((_,j)=>j!==i)}
  if(/^早安尼好/.test(head))head="";
  const ch=(r.chapters||[]).map(c=>({t:c.t,x:c.x.replace(/^[\d:\s]+/,"").replace(/^[🎵🎶♪♫]\s*/u,"").trim()})).filter(c=>c.x&&!NOISE.test(c.x)&&!CH_SKIP.test(c.x));
  if(!head)head=ch[0]?.x||"本週國內國際大小事";

function miniStop(){if(mini){try{mini.destroy()}catch(e){}}mini=null;miniVid=null;const b=document.getElementById("mini");if(b){b.hidden=true;b.querySelector(".minivid").innerHTML='<div id="miniyt"></div>'}miniState(false)}
function initFlows(){
  document.querySelectorAll(".flow").forEach(f=>{
    const lang=f.dataset.lang,items=[...f.querySelectorAll(".cf")],cap=f.parentElement.querySelector(".cfcap");
    const W=()=>items[0]?.offsetWidth||180;
    let idx=Math.min(flowIdx[lang]||0,items.length-1);
    const lay=()=>{const w=W();items.forEach((el,i)=>{const o=i-idx,a=Math.abs(o),s=Math.sign(o);
        const x=o===0?0:s*(w*.72+(a-1)*w*.26);
        el.style.transform=`translateX(calc(-50% + ${x}px)) translateZ(${o===0?60:-120}px) rotateY(${o===0?0:-s*68}deg)`;
        el.style.zIndex=String(200-a);el.style.opacity=a>9?"0":"1";el.style.pointerEvents=a>9?"none":"";
        el.classList.toggle("mid",o===0);el.setAttribute("aria-selected",String(o===0))});
      const x=RECS.find(y=>y.k===items[idx]?.dataset.cf);if(cap&&x)cap.innerHTML=`<b>${esc(x.title)}</b><small>${idx+1} / ${items.length}</small>`;flowIdx[lang]=idx};
    const go=n=>{idx=Math.max(0,Math.min(items.length-1,n));lay()};
    f._go=go;f._idx=()=>idx;lay();
    f.addEventListener("keydown",e=>{if(e.key==="ArrowRight"){e.preventDefault();go(idx+1)}else if(e.key==="ArrowLeft"){e.preventDefault();go(idx-1)}else if(e.key==="Enter"){e.preventDefault();setJuke(items[idx].dataset.cf,items[idx])}});
    let acc=0,wt=0;f.addEventListener("wheel",e=>{const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:(e.shiftKey?e.deltaY:0);if(!d)return;e.preventDefault();acc+=d;if(Math.abs(acc)>40){go(idx+Math.sign(acc));acc=0}},{passive:false});
    let sx=null,si=0,moved=false;f.addEventListener("dragstart",e=>e.preventDefault());
    f.addEventListener("pointerdown",e=>{if(e.target.closest(".fnav"))return;sx=e.clientX;si=idx;moved=false;try{f.setPointerCapture(e.pointerId)}catch(_){}});
    f.addEventListener("pointermove",e=>{if(sx===null)return;const d=e.clientX-sx;if(Math.abs(d)>8)moved=true;const n=si-Math.round(d/60);if(n!==idx)go(n)});
    const up=e=>{if(sx!==null&&!moved&&e&&e.type==="pointerup"){const el=document.elementsFromPoint(e.clientX,e.clientY).find(n=>n.classList&&n.classList.contains("cf"));if(el){moved=true;if(el.classList.contains("mid"))setJuke(el.dataset.cf,el);else go(+el.dataset.i)}}sx=null};f.addEventListener("pointerup",up);f.addEventListener("pointerleave",up);f.addEventListener("pointercancel",up);
    f.addEventListener("click",e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false}},true);
  });
}
addEventListener("resize",()=>{document.querySelectorAll(".flow").forEach(f=>f._go&&f._go(f._idx()))});
document.getElementById("view").addEventListener("click",e=>{
  const fn=e.target.closest("[data-fnav]");if(fn){e.stopPropagation();const f=fn.closest(".flow");f._go(f._idx()+ +fn.dataset.fnav);return}
  if(e.target.closest(".cf")||e.target.closest(".flow")&&!e.target.closest(".fnav")){e.stopPropagation();e.preventDefault();return}
  const jp=e.target.closest("[data-jplay]");if(jp){e.stopPropagation();const x=RECS.find(y=>y.k===jp.dataset.jplay);if(x)miniPlay(x);return}
  const mt=e.target.closest("#mtoggle");if(mt){e.stopPropagation();if(!mini)return;const st=mini.getPlayerState?.();if(st===1){mini.pauseVideo()}else mini.playVideo();return}
  const ms=e.target.closest("#mstop");if(ms){e.stopPropagation();miniStop();return}
  const fj=e.target.closest("[data-flowjump]");if(fj){e.preventDefault();document.getElementById("flow-"+fj.dataset.flowjump)?.scrollIntoView({behavior:"smooth",block:"center"});return}
  const bk=e.target.closest(".bk[data-book]");if(bk&&state.sec==="books"){e.stopPropagation();openBookFx(bk);return}
},true);
document.getElementById("view").addEventListener("submit",e=>{if(e.target.id!=="hsf")return;e.preventDefault();const v=document.getElementById("hq").value.trim();qi.value=v;clr.hidden=!v;state.q=v;window.__keepQ=true;goSec("live")});

fetch("data.json",{cache:"no-cache"}).then(r=>r.json()).then(d=>{D=d;prep();buildLibrary();applyDriveCovers();renderStats();route()}).catch(()=>{document.getElementById("view").innerHTML='<p class="empty">資料載入失敗，請重新整理一次</p>'});
}
</script>
</body>
